aid: vytalize-health
name: Vytalize Health
description: >-
  Vytalize Health is a Hoboken, New Jersey based value-based care company that operates as a Medicare
  Accountable Care Organization (ACO), partnering with independent primary care practices, group
  practices, community health centers and existing ACOs to move them into risk-bearing Medicare
  programs. The company pairs shared-savings economics with a technology and clinical services stack:
  Vytal Insights, a physician-built clinical decision support product that analyzes claims data,
  clinical notes, hospital admission-discharge-transfer feeds and social determinants of health to
  surface point-of-care recommendations; Vytal Care, a suite of remote and in-home programs
  (transitions of care, chronic disease management, home health review) delivered by an
  interdisciplinary team of RN care managers, health coaches, pharmacists and licensed clinical social
  workers; and Vytal Network, its specialist, hospital and ancillary provider network layer. Vytalize
  supports tens of thousands of Medicare beneficiaries across multiple states. Its software reaches
  practice partners through an authenticated web portal at app.vytalizehealth.com rather than through
  a public developer platform.
