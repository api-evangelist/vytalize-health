  detail: >-
    Vytalize Health ships software only to signed-on practice partners through an Entra ID login at
    app.vytalizehealth.com; the product backend that portal calls
    (prod-banzai-services.vytalizehealth.com, an AWS ELB) drops public TCP connections on 443 on every
    published address, and the company's only openly reachable machine-readable API is the marketing
    site's WordPress REST index at www.vytalizehealth.com/wp-json/, which is CMS infrastructure and
    not a Vytalize product.
